<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="page">
  <header class="header">
    <img src="./eisenhower-matrix.jpg" class="header-img">
    <a class="more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
  <main class="hero">
    <div id="hero-top">
      <label class="new-task-hero" for="new-task">Add Item</label>
      <div class="task-wrapper">
        <input id="new-task" class="task-input" type="text">
        <button class="btn-add btn">Add</button>
      </div>
    </div>
    <h1 class="section-title">Todo</h1>
    <ul id="incomplete-tasks" class="task-list">
      <li class="task-item">
        <input type="checkbox" class="task-check">
        <label class="task">Pay Bills</label>
        <input type="text" class="task-input">
        <button class="edit btn">Edit</button>
        <button class="delete btn">
          <img src="./remove.svg" class="delete-img">
        </button>
      </li>
      <li class="task-item edit-mode">
        <input type="checkbox" class="task-check">
        <label class="task">Go Shopping</label>
        <input type="text" value="Go Shopping" class="task-input">
        <button class="edit btn">Save</button>
        <button class="delete btn">
          <img src="./remove.svg" class="delete-img">
        </button>
      </li>
    </ul>
    <h2 class="section-title">Completed</h2>
    <ul id="completed-tasks" class="task-list">
      <li class="task-item">
        <input type="checkbox" checked class="task-check">
        <label class="task">See the Doctor</label>
        <input type="text" class="task-input">
        <button class="edit btn">Edit</button>
        <button class="delete btn">
          <img src="./remove.svg" class="delete-img">
        </button>
      </li>
    </ul>
  </main>
    <script src="app.js"></script>
</body>
</html>
